name: Deploy Playground

on:
  push:
    branches: [main]
  workflow_dispatch:

# allow this workflow to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# one live deploy at a time; don't cancel an in-progress deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # the playground imports each package's built dist/, so build the
      # libraries first, then the app under the Pages sub-path
      - name: Build packages
        run: pnpm build

      - name: Build playground
        # exec (not `run <script> -- args`) reliably forwards --base to Vite
        working-directory: apps/playground
        run: pnpm exec vite build --base=/softium-ui/

      # GitHub Pages has no SPA fallback: a deep link / refresh to
      # /softium-ui/sheet would 404. Serving a copy of index.html as 404.html
      # lets the History-API router boot and resolve the path client-side.
      - name: SPA fallback
        run: cp apps/playground/dist/index.html apps/playground/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
